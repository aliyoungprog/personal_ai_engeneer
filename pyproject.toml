[project]
name = "ai-agent-bot"
version = "0.1.0"
description = "Autonomous coding agent: Notion tasks -> Claude Code -> GitLab MRs, controlled via Telegram"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "notion-client>=2.2",
    "python-gitlab>=4.10",
    "pydantic-settings>=2.5",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "T20"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]
